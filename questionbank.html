<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HireView — Question Bank</title>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <meta name="robots" content="noindex, follow">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">

  <!-- CodeMirror — lightweight in-browser code editor, used by the Coding
       tab's practice compiler (see renderCodingModal in js/questionbank.js). -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>

  <style>
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.75rem; flex-wrap: wrap; gap: 1rem; }
    .page-title { font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, var(--hv-primary) 0%, var(--hv-accent) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .page-sub { color: rgba(255,255,255,0.6); font-size: 0.92rem; margin-top: 0.25rem; }

    /* Category tabs */
    .qb-tabs { display: flex; gap: 0.6rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .qb-tab { padding: 0.7rem 1.4rem; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(99,102,241,0.2); color: rgba(255,255,255,0.7); font-weight: 700; cursor: pointer; font-family: inherit; font-size: 0.92rem; transition: all 0.2s ease; }
    .qb-tab:hover { background: rgba(255,255,255,0.08); }
    .qb-tab.active { background: linear-gradient(135deg, var(--hv-primary), var(--hv-accent)); color: white; border-color: transparent; box-shadow: 0 4px 18px rgba(99,102,241,0.35); }

    /* Filters */
    .qb-filters { display: flex; gap: 0.75rem; margin-bottom: 1.75rem; flex-wrap: wrap; align-items: center; }
    .qb-filter-select { padding: 0.65rem 1rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(99,102,241,0.25); border-radius: 10px; color: white; font-family: inherit; font-size: 0.85rem; cursor: pointer; }
    .qb-filter-select option { background: var(--hv-bg-mid); }
    .qb-stat-pill { margin-left: auto; font-size: 0.82rem; color: rgba(255,255,255,0.55); background: rgba(255,255,255,0.04); padding: 0.5rem 0.9rem; border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); }

    /* Topic chips */
    .qb-topics { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.75rem; }
    .qb-topic-chip { padding: 0.45rem 0.9rem; border-radius: 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.65); font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .qb-topic-chip:hover { border-color: rgba(99,102,241,0.4); }
    .qb-topic-chip.active { background: rgba(99,102,241,0.2); border-color: var(--hv-primary); color: var(--hv-primary-tint); }

    /* Question grid */
    .qb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .qb-card { background: rgba(255,255,255,0.04); backdrop-filter: blur(20px); border-radius: 16px; border: 1px solid rgba(99,102,241,0.15); padding: 1.35rem; cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; gap: 0.75rem; }
    .qb-card:hover { border-color: rgba(99,102,241,0.5); transform: translateY(-2px); background: rgba(255,255,255,0.06); }
    .qb-card-top { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
    .qb-topic-tag { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: var(--hv-primary-light); background: rgba(99,102,241,0.12); padding: 0.25rem 0.6rem; border-radius: 8px; }
    .qb-diff { font-size: 0.72rem; font-weight: 700; padding: 0.25rem 0.6rem; border-radius: 8px; }
    .qb-diff-easy { color: var(--hv-success); background: rgba(34,197,94,0.12); }
    .qb-diff-medium { color: var(--hv-warning); background: rgba(245,158,11,0.12); }
    .qb-diff-hard { color: var(--hv-error-light); background: rgba(239,68,68,0.12); }
    .qb-card-prompt { font-size: 0.95rem; color: rgba(255,255,255,0.88); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .qb-card-cta { font-size: 0.82rem; color: rgba(255,255,255,0.5); font-weight: 600; }

    .qb-empty { text-align: center; padding: 3rem 1rem; color: rgba(255,255,255,0.5); }
    .qb-loading { text-align: center; padding: 3rem 1rem; color: rgba(255,255,255,0.5); }

    /* Practice modal */
    .qb-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(5,6,20,0.75); backdrop-filter: blur(6px); z-index: 200; align-items: flex-start; justify-content: center; padding: 4vh 1rem; overflow-y: auto; }
    .qb-modal-overlay.open { display: flex; }
    .qb-modal { background: linear-gradient(160deg, var(--hv-modal-grad-start) 0%, var(--hv-modal-grad-end) 100%); border: 1px solid rgba(99,102,241,0.3); border-radius: 20px; max-width: 720px; width: 100%; padding: 2rem; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    .qb-modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 1.25rem; }
    .qb-modal-close { background: rgba(255,255,255,0.06); border: none; color: rgba(255,255,255,0.7); width: 34px; height: 34px; border-radius: 10px; cursor: pointer; font-size: 1.1rem; flex-shrink: 0; }
    .qb-modal-close:hover { background: rgba(255,255,255,0.12); }
    .qb-modal-prompt { font-size: 1.1rem; font-weight: 700; color: white; line-height: 1.6; margin-bottom: 1.5rem; }

    .qb-options { display: flex; flex-direction: column; gap: 0.7rem; margin-bottom: 1.25rem; }
    .qb-option { padding: 0.9rem 1.1rem; border-radius: 12px; background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.85); cursor: pointer; font-family: inherit; font-size: 0.95rem; text-align: left; transition: all 0.15s ease; }
    .qb-option:hover:not(.disabled) { border-color: rgba(99,102,241,0.5); background: rgba(99,102,241,0.08); }
    .qb-option.selected { border-color: var(--hv-primary); background: rgba(99,102,241,0.15); }
    .qb-option.correct { border-color: var(--hv-success); background: rgba(34,197,94,0.15); color: var(--hv-success-tint-light); }
    .qb-option.incorrect { border-color: var(--hv-error); background: rgba(239,68,68,0.15); color: var(--hv-error-tint-light); }
    .qb-option.disabled { cursor: default; }

    .qb-result-banner { padding: 1rem 1.25rem; border-radius: 12px; margin-bottom: 1rem; font-weight: 700; font-size: 0.95rem; }
    .qb-result-banner.correct { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.35); color: var(--hv-success-tint); }
    .qb-result-banner.incorrect { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.35); color: var(--hv-error-tint); }
    .qb-explanation { font-size: 0.9rem; color: rgba(255,255,255,0.7); line-height: 1.6; margin-top: 0.4rem; }

    .qb-modal-actions { display: flex; gap: 0.75rem; margin-top: 1.5rem; }
    .qb-code-block { background: var(--hv-bg-start); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1rem 1.25rem; font-family: 'Courier New', monospace; font-size: 0.85rem; color: var(--hv-info-tint); white-space: pre-wrap; overflow-x: auto; margin-bottom: 1rem; line-height: 1.55; }
    .qb-constraints { font-size: 0.85rem; color: rgba(255,255,255,0.55); margin-bottom: 1rem; }
    .qb-sample-case { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 0.85rem 1rem; margin-bottom: 0.6rem; font-size: 0.85rem; }
    .qb-sample-case b { color: var(--hv-primary-light); }
    .qb-coding-note { font-size: 0.82rem; color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.15); border-radius: 10px; padding: 0.8rem 1rem; margin-top: 0.5rem; }

    /* In-modal coding practice editor */
    .qb-editor-top { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; margin: 0.25rem 0 0.75rem; flex-wrap: wrap; }
    .qb-lang-select { padding: 0.55rem 0.9rem; background: rgba(255,255,255,0.06); border: 2px solid rgba(99,102,241,0.3); border-radius: 10px; color: white; font-family: inherit; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
    .qb-lang-select option { background: var(--hv-bg-mid); color: white; }
    .qb-editor-actions { display: flex; gap: 0.5rem; }
    .qb-btn { padding: 0.55rem 1rem; border-radius: 10px; border: 2px solid rgba(99,102,241,0.3); background: rgba(255,255,255,0.05); color: white; font-family: inherit; font-weight: 700; font-size: 0.82rem; cursor: pointer; transition: all 0.2s ease; }
    .qb-btn:hover { border-color: var(--hv-primary); background: rgba(99,102,241,0.15); }
    .qb-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .qb-btn.submit { background: linear-gradient(135deg, var(--hv-primary), var(--hv-accent)); border-color: transparent; }
    .qb-editor-wrap .CodeMirror { height: 260px; border-radius: 12px; border: 2px solid rgba(99,102,241,0.2); font-family: 'Courier New', monospace; font-size: 0.88rem; margin-bottom: 0.75rem; }
    .qb-result-banner-run { padding: 0.75rem 0.9rem; border-radius: 10px; font-weight: 700; font-size: 0.85rem; margin-bottom: 0.6rem; }
    .qb-result-banner-run.pass { background: rgba(34,197,94,0.14); color: var(--hv-success); border: 1px solid rgba(34,197,94,0.3); }
    .qb-result-banner-run.fail { background: rgba(239,68,68,0.14); color: var(--hv-error-light); border: 1px solid rgba(239,68,68,0.3); }
    .qb-case-row { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0.75rem; border-radius: 8px; background: rgba(0,0,0,0.2); margin-bottom: 0.35rem; font-size: 0.8rem; }
    .qb-case-row.pass { border-left: 3px solid var(--hv-success); }
    .qb-case-row.fail { border-left: 3px solid var(--hv-error-light); }
    .qb-case-detail { font-family: 'Courier New', monospace; white-space: pre-wrap; background: rgba(0,0,0,0.25); padding: 0.55rem 0.7rem; border-radius: 8px; margin: 0.3rem 0 0.5rem; font-size: 0.78rem; color: rgba(255,255,255,0.85); }
    .qb-compile-error { font-family: 'Courier New', monospace; white-space: pre-wrap; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; padding: 0.7rem 0.9rem; border-radius: 10px; font-size: 0.78rem; margin-bottom: 0.6rem; }
    .qb-interview-note { font-size: 0.85rem; color: rgba(255,255,255,0.55); line-height: 1.6; }

    @media (max-width: 640px) {
      .qb-modal { padding: 1.4rem; }
      .qb-stat-pill { margin-left: 0; }
    }

    /* Shared widgets not in main.css (page-local, same as dashboard.html) */
    .hv-toast { position: fixed; bottom: 5.5rem; left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(26,31,58,0.95); border: 1px solid rgba(99,102,241,0.4); color: white; padding: 0.9rem 1.5rem; border-radius: 14px; font-size: 0.9rem; font-weight: 600; box-shadow: 0 12px 35px rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: all 0.3s ease; z-index: 999; }
    .hv-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .hv-toast.error { border-color: rgba(239,68,68,0.5); }
    .start-btn { padding: 0.85rem 1.75rem; background: linear-gradient(135deg, var(--hv-primary), var(--hv-accent)); border: none; border-radius: 12px; color: white; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 0.95rem; transition: all 0.3s ease; box-shadow: 0 4px 20px rgba(99,102,241,0.4); }
    .start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(99,102,241,0.6); }
  </style>
</head>
<body>
  <script src="/js/sidebar.js" data-active="questionbank"></script>
  <div class="app-container">
    <main class="main-content">
      <div class="content-wrapper">

        <div class="page-header">
          <div>
            <div class="page-title">Question Bank</div>
            <div class="page-sub">Practice real aptitude, coding &amp; interview questions — no signup on some random PDF site, just open and go.</div>
          </div>
        </div>

        <div class="qb-tabs" id="qbTabs">
          <button class="qb-tab active" data-category="aptitude">🧮 Aptitude</button>
          <button class="qb-tab" data-category="coding">💻 Coding</button>
          <button class="qb-tab" data-category="interview">🗣️ Interview</button>
        </div>

        <div class="qb-filters">
          <select class="qb-filter-select" id="difficultyFilter">
            <option value="">All difficulties</option>
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
          <span class="qb-stat-pill" id="qbStatPill">Loading…</span>
        </div>

        <div class="qb-topics" id="qbTopics"></div>

        <div id="qbGridWrap">
          <div class="qb-loading">Loading questions…</div>
        </div>

      </div>
    </main>
  </div>

  <!-- Practice modal -->
  <div class="qb-modal-overlay" id="qbModalOverlay">
    <div class="qb-modal" id="qbModal"></div>
  </div>

  <div class="hv-toast" id="hvToast"></div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="/js/questionbank.js" defer></script>
  <script src="js/footer.js"></script>
</body>
</html>
