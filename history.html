<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HireView — Interview History</title>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <meta name="robots" content="noindex, follow">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
    .page-title { font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .back-btn { padding: 0.75rem 1.25rem; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: rgba(255,255,255,0.7); font-weight: 600; cursor: pointer; font-family: inherit; font-size: 0.9rem; transition: all 0.2s ease; }
    .back-btn:hover { background: rgba(255,255,255,0.1); }

    /* Interview List */
    .history-list { display: flex; flex-direction: column; gap: 1rem; }
    .history-card { background: rgba(255,255,255,0.04); backdrop-filter: blur(20px); border-radius: 18px; border: 1px solid rgba(99,102,241,0.15); overflow: hidden; transition: all 0.2s ease; }
    .history-card-highlight { border-color: rgba(99,102,241,0.7); box-shadow: 0 0 0 3px rgba(99,102,241,0.25); }
    .history-card:hover { border-color: rgba(99,102,241,0.35); }
    .history-card-header { padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; flex-wrap: wrap; gap: 1rem; }
    .history-card-header:hover { background: rgba(255,255,255,0.02); }
    .history-role { font-weight: 700; font-size: 1.05rem; color: white; margin-bottom: 0.3rem; }
    .history-date { font-size: 0.82rem; color: rgba(255,255,255,0.4); }
    .history-meta { display: flex; align-items: center; gap: 1rem; }
    .history-score { font-size: 1.5rem; font-weight: 800; }
    .status-badge { padding: 0.3rem 0.85rem; border-radius: 20px; font-size: 0.78rem; font-weight: 700; }
    .status-completed { background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid rgba(34,197,94,0.3); }
    .status-in_progress { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }
    .status-cheating_terminated { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    .status-failed { background: rgba(148,163,184,0.15); color: #94a3b8; border: 1px solid rgba(148,163,184,0.3); }
    .sector-badge { padding: 0.3rem 0.85rem; border-radius: 20px; font-size: 0.78rem; font-weight: 700; white-space: nowrap; }
    .sector-government { background: rgba(99,102,241,0.15); color: #818cf8; border: 1px solid rgba(99,102,241,0.3); }
    .sector-private { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.12); }
    .gov-info-box { background: rgba(99,102,241,0.06); border: 1px solid rgba(99,102,241,0.2); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; font-size: 0.88rem; color: rgba(255,255,255,0.75); line-height: 1.6; }
    .gov-info-label { font-size: 0.75rem; font-weight: 700; color: #818cf8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.4rem; }
    .expand-icon { color: rgba(255,255,255,0.4); font-size: 1.2rem; transition: transform 0.3s ease; flex-shrink: 0; }
    .expand-icon.open { transform: rotate(180deg); }

    /* Expanded Content */
    .history-card-body { display: none; border-top: 1px solid rgba(99,102,241,0.15); }
    .history-card-body.open { display: block; }

    /* Feedback Section */
    .feedback-section { padding: 1.5rem; border-bottom: 1px solid rgba(99,102,241,0.1); }
    .feedback-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.5); margin-bottom: 1rem; }
    .scores-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin-bottom: 1rem; }
    .score-chip { background: rgba(0,0,0,0.2); border-radius: 12px; padding: 0.75rem; text-align: center; }
    .score-chip-value { font-size: 1.4rem; font-weight: 800; }
    .score-chip-label { font-size: 0.75rem; color: rgba(255,255,255,0.5); margin-top: 0.2rem; }
    .rec-badge { display: inline-block; padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.82rem; font-weight: 700; margin-bottom: 1rem; }
    .feedback-summary { font-size: 0.9rem; color: rgba(255,255,255,0.7); line-height: 1.7; margin-bottom: 1rem; }
    .strengths-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem; }
    .strength-item { background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.2); border-radius: 10px; padding: 0.75rem; font-size: 0.85rem; color: rgba(255,255,255,0.8); }
    .improve-item { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2); border-radius: 10px; padding: 0.75rem; font-size: 0.85rem; color: rgba(255,255,255,0.8); }
    .next-steps-box { background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.2); border-radius: 12px; padding: 1rem; font-size: 0.9rem; color: rgba(255,255,255,0.75); line-height: 1.6; }
    .personal-note-box { background: linear-gradient(135deg, rgba(99,102,241,0.1), rgba(236,72,153,0.08)); border: 1px solid rgba(99,102,241,0.25); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; display: flex; gap: 0.75rem; align-items: flex-start; }
    .personal-note-avatar { width: 34px; height: 34px; flex-shrink: 0; border-radius: 50%; background: linear-gradient(135deg,#6366f1,#ec4899); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.85rem; }
    .personal-note-text { font-size: 0.88rem; color: rgba(255,255,255,0.82); line-height: 1.6; font-style: italic; }

    /* Q&A Section */
    .qa-section { padding: 1.5rem; }
    .qa-item { margin-bottom: 1.25rem; padding-bottom: 1.25rem; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .qa-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .qa-question { font-size: 0.9rem; font-weight: 700; color: #818cf8; margin-bottom: 0.5rem; line-height: 1.5; }
    .qa-answer { font-size: 0.88rem; color: rgba(255,255,255,0.65); line-height: 1.6; }
    .qa-skipped { color: rgba(255,255,255,0.3); font-style: italic; }
    .no-qa { font-size: 0.9rem; color: rgba(255,255,255,0.3); text-align: center; padding: 1rem 0; }

    .empty-state { text-align: center; padding: 4rem 2rem; color: rgba(255,255,255,0.4); }
    .empty-icon { font-size: 3rem; margin-bottom: 1rem; }
    .loading-shimmer { background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 18px; height: 80px; margin-bottom: 1rem; }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    .strengths-improve-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem; }

    @media (max-width: 768px) {
      .page-title { font-size: 1.4rem; }
      .history-card-header { padding: 1.25rem; }
      .history-role { font-size: 0.95rem; }
      .history-meta { width: 100%; justify-content: space-between; }
      .scores-row { grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
      .score-chip { padding: 0.5rem; }
      .score-chip-value { font-size: 1.1rem; }
      .strengths-grid,
      .strengths-improve-grid { grid-template-columns: 1fr; }
      .feedback-section, .qa-section { padding: 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <main class="main-content">
      <div class="content-wrapper">

        <div class="page-header">
          <div class="page-title">📋 Interview History</div>
          <div style="display:flex;gap:0.75rem">
            <button class="back-btn" onclick="window.location.href = '/dashboard'">← Dashboard</button>
            <button class="back-btn" onclick="window.location.href='/interview'" style="background:rgba(99,102,241,0.2);border-color:rgba(99,102,241,0.4);color:#818cf8">+ New Interview</button>
          </div>
        </div>

        <div id="historyContainer">
          <div class="loading-shimmer"></div>
          <div class="loading-shimmer"></div>
          <div class="loading-shimmer"></div>
        </div>

      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (!authToken) window.location.href = '/auth';

    function formatDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleDateString('en-IN', {
        day: 'numeric', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function getScoreColor(score) {
      if (!score) return 'rgba(255,255,255,0.3)';
      if (score >= 8) return '#22c55e';
      if (score >= 6) return '#f59e0b';
      return '#ef4444';
    }

    function getRecColor(rec) {
      if (!rec) return '#6366f1';
      if (rec.includes('Strong')) return '#22c55e';
      if (rec === 'Hire') return '#6366f1';
      if (rec === 'Borderline') return '#f59e0b';
      return '#ef4444';
    }

    function renderFeedback(feedback) {
      if (!feedback) return `<div class="feedback-section"><div class="no-qa">No feedback available for this session.</div></div>`;

      const recColor = getRecColor(feedback.hiring_recommendation);
      const strengths = (feedback.strengths || []).map(s =>
        `<div class="strength-item">✅ ${s}</div>`).join('');
      const improve = (feedback.areas_to_improve || []).map(a =>
        `<div class="improve-item">📈 ${a}</div>`).join('');

      return `
        <div class="feedback-section">
          <div class="feedback-title">📊 Feedback Report</div>
          <div class="scores-row">
            <div class="score-chip">
              <div class="score-chip-value" style="color:${getScoreColor(feedback.overall_score)}">${feedback.overall_score || '—'}/10</div>
              <div class="score-chip-label">Overall</div>
            </div>
            <div class="score-chip">
              <div class="score-chip-value" style="color:#6366f1">${feedback.technical_score || '—'}/10</div>
              <div class="score-chip-label">Technical</div>
            </div>
            <div class="score-chip">
              <div class="score-chip-value" style="color:#ec4899">${feedback.soft_skills_score || '—'}/10</div>
              <div class="score-chip-label">Soft Skills</div>
            </div>
          </div>
          <div class="rec-badge" style="background:${recColor}22;border:1px solid ${recColor};color:${recColor}">
            ${feedback.hiring_recommendation || 'Pending'}
          </div>
          ${feedback.personal_note ? `
            <div class="personal-note-box">
              <div class="personal-note-avatar">A</div>
              <div>
                <div style="font-size:0.75rem;font-weight:700;color:rgba(255,255,255,0.6);margin-bottom:0.3rem;text-transform:uppercase;letter-spacing:0.5px">A note from Arjun</div>
                <div class="personal-note-text">"${feedback.personal_note}"</div>
              </div>
            </div>` : ''}
          <div class="feedback-summary">${feedback.summary || ''}</div>
          ${strengths || improve ? `
            <div class="strengths-improve-grid">
              <div>
                <div style="font-size:0.78rem;font-weight:700;color:#22c55e;margin-bottom:0.5rem;text-transform:uppercase;letter-spacing:0.5px">Strengths</div>
                ${strengths}
              </div>
              <div>
                <div style="font-size:0.78rem;font-weight:700;color:#f87171;margin-bottom:0.5rem;text-transform:uppercase;letter-spacing:0.5px">Areas to Improve</div>
                ${improve}
              </div>
            </div>` : ''}
          ${feedback.next_steps ? `
            <div>
              <div style="font-size:0.78rem;font-weight:700;color:#818cf8;margin-bottom:0.5rem;text-transform:uppercase;letter-spacing:0.5px">🎯 Next Steps</div>
              <div class="next-steps-box">${feedback.next_steps}</div>
            </div>` : ''}
        </div>`;
    }

    function getSectorBadge(i) {
      if (i.sector === 'government') {
        const label = i.government_domain ? `🏛️ ${i.government_domain}` : '🏛️ Government';
        return `<span class="sector-badge sector-government">${label}</span>`;
      }
      return `<span class="sector-badge sector-private">💼 Private</span>`;
    }

    function renderGovInfo(i) {
      if (i.sector !== 'government') return '';
      return `
        <div class="gov-info-section" style="padding:1.5rem 1.5rem 0 1.5rem">
          <div class="gov-info-box">
            <div class="gov-info-label">🏛️ Government Role</div>
            <div>${i.government_role || '—'}${i.government_domain ? ` · ${i.government_domain}` : ''}</div>
            ${i.candidate_summary ? `<div class="gov-info-label" style="margin-top:0.75rem">Candidate Summary</div><div>${i.candidate_summary}</div>` : ''}
          </div>
        </div>`;
    }

    function renderQA(questions) {
      if (!questions || questions.length === 0) {
        return `<div class="qa-section"><div class="no-qa">No questions recorded for this session.</div></div>`;
      }
      const items = questions.map((q, i) => `
        <div class="qa-item">
          <div class="qa-question">Q${i + 1}. ${q.question_text}</div>
          <div class="qa-answer ${q.answer_text === '[Skipped]' ? 'qa-skipped' : ''}">
            ${q.answer_text === '[Skipped]' ? '⏭️ Skipped' : q.answer_text || '—'}
          </div>
        </div>`).join('');
      return `<div class="qa-section"><div class="feedback-title">💬 Questions & Answers</div>${items}</div>`;
    }

    function toggleCard(id) {
      const body = document.getElementById(`body-${id}`);
      const icon = document.getElementById(`icon-${id}`);
      body.classList.toggle('open');
      icon.classList.toggle('open');
    }

    // If the user landed here from a "recent interview" click on the
    // dashboard (/history?id=123), open that specific card's details
    // and scroll it into view instead of just showing the plain list.
    function openInterviewFromQuery() {
      const id = new URLSearchParams(window.location.search).get('id');
      if (!id) return;

      const card = document.getElementById(`card-${id}`);
      if (!card) return; // e.g. a stale/failed session that got filtered out

      const body = document.getElementById(`body-${id}`);
      const icon = document.getElementById(`icon-${id}`);
      if (body && !body.classList.contains('open')) {
        body.classList.add('open');
        if (icon) icon.classList.add('open');
      }

      card.classList.add('history-card-highlight');
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setTimeout(() => card.classList.remove('history-card-highlight'), 2500);
    }

    function renderHistory(interviews) {
      const container = document.getElementById('historyContainer');

      const relevant = interviews.filter(i =>
        i.questions.length > 0 || i.feedback ||
        i.status === 'completed' || i.status === 'cheating_terminated' || i.status === 'failed'
      );

      if (relevant.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📋</div>
            <div style="font-weight:700;font-size:1.1rem;margin-bottom:0.5rem">No interviews yet</div>
            <div style="font-size:0.9rem">Complete an interview to see your history here</div>
          </div>`;
        return;
      }

      const nonExpandable = i => i.status === 'cheating_terminated' || i.status === 'failed';

      container.innerHTML = `<div class="history-list">${relevant.map(i => `
        <div class="history-card" id="card-${i.id}">
         <div class="history-card-header" ${!nonExpandable(i) ? `onclick="toggleCard(${i.id})"` : ''}>
            <div>
              <div class="history-role">${i.role}</div>
              <div class="history-date">📅 ${formatDate(i.started_at)}</div>
            </div>
            <div class="history-meta">
              ${getSectorBadge(i)}
              <div class="history-score" style="color:${getScoreColor(i.overall_score)}">
                ${i.overall_score ? `${i.overall_score}/10` : '—'}
              </div>
              <span class="status-badge status-${i.status}">
                ${i.status === 'completed' ? '✅ Completed' 
                : i.status === 'cheating_terminated' ? '🚨 Terminated'
                : i.status === 'failed' ? '⚠️ Failed — not counted'
                : '🔄 In Progress'}
              </span>
              ${!nonExpandable(i) ? `<span class="expand-icon" id="icon-${i.id}">▼</span>` : ''}
            </div>
          </div>
          <div class="history-card-body" id="body-${i.id}">
            ${i.status === 'cheating_terminated' 
              ? `<div style="padding:1.5rem;background:rgba(239,68,68,0.06);border-top:1px solid rgba(239,68,68,0.2)">
                  <div style="color:#f87171;font-weight:700;font-size:1rem;margin-bottom:0.5rem">🚨 Interview Terminated Due to Integrity Violation</div>
                  <div style="color:rgba(255,255,255,0.6);font-size:0.9rem;line-height:1.6">This interview was terminated because cheating signals were detected (tab switching or multiple faces on camera). No score or feedback is available for this session.</div>
                </div>`
              : i.status === 'failed'
              ? `<div style="padding:1.5rem;background:rgba(148,163,184,0.06);border-top:1px solid rgba(148,163,184,0.2)">
                  <div style="color:#94a3b8;font-weight:700;font-size:1rem;margin-bottom:0.5rem">⚠️ Interview Failed</div>
                  <div style="color:rgba(255,255,255,0.6);font-size:0.9rem;line-height:1.6">${i.failure_reason || 'This session could not be completed due to a technical issue.'}</div>
                  <div style="color:rgba(255,255,255,0.4);font-size:0.82rem;margin-top:0.75rem">This attempt was not your fault — it has NOT been counted against your free interviews.</div>
                </div>`
              : `${renderGovInfo(i)}${renderFeedback(i.feedback)}${renderQA(i.questions)}`
            }
          </div>
        </div>`).join('')}
      </div>`;
    }

    async function loadHistory() {
      try {
        const res = await fetch(`${BACKEND_URL}/api/history`, {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });

        if (!res.ok) {
          if (res.status === 401) { window.location.href = '/auth'; return; }
          throw new Error('Failed to load history');
        }

        const data = await res.json();
        renderHistory(data);
        openInterviewFromQuery();

      } catch (err) {
        console.error('History error:', err);
        document.getElementById('historyContainer').innerHTML =
          '<div style="color:#f87171;padding:1rem">Could not load history. Is the backend running?</div>';
      }
    }

    loadHistory();
  </script>
</body>
</html>
