services:
  - type: web
    name: hireview-backend
    runtime: python
    rootDir: hireview-backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python seed_questions.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.9"